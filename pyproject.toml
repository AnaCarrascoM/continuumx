[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuumx"
dynamic = ["version"]
authors = [
    {name = "Ana Carrasco Martín", email = "anacarrasco01@icloud.com"},
]
description = "Distances, eccentricity, diameter, radius and center of continuous graphs, built on NetworkX"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["graph theory", "continuous graph", "metric graph", "diameter", "radius", "networkx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "networkx>=3.0",
]

[project.urls]
Homepage = "https://github.com/AnaCarrascoM/continuumx"
Repository = "https://github.com/AnaCarrascoM/continuumx"
Issues = "https://github.com/AnaCarrascoM/continuumx/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "types-networkx",
]

[tool.pytest.ini_options]
testpaths = ["tests", "continuumx"]
addopts = "--doctest-modules --doctest-glob='*.md'"

[tool.black]
line-length = 88

[tool.setuptools.dynamic]
version = {attr = "continuumx.__version__"}

[tool.setuptools.packages.find]
include = ["continuumx*"]

[tool.setuptools.package-data]
continuumx = ["py.typed"]
