[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuumx"
version = "0.1.0"
authors = [
    {name = "Ana Carrasco Martin", email = "anacarrasco01@icloud.com"},
]
description = "Continuous graphs on top of networkx"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["graph", "network", "continuous graph", "metric parameters", "networkx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests", "continuumx"]
addopts = "--doctest-modules --doctest-glob='*.md'"

[tool.black]
line-length = 88

[tool.setuptools.packages.find]
include = ["continuumx*"]

[tool.setuptools.package-data]
continuumx = ["py.typed"]
